# FastMM documentation site (MkDocs + Material). Preview: ./scripts/docs-serve.sh
# The Markdown under docs/ is the source and stays readable on GitHub; this file only orders it.
site_name: FastMM
site_description: A market-making engine in C++20. Backtests, replay and live trading run the same strategy code.
site_url: https://ziy.bio/FastMM/
site_author: Ziyang Liu
repo_url: https://github.com/ziyangliu-666/FastMM
repo_name: ziyangliu-666/FastMM
edit_uri: edit/main/docs/
copyright: MIT licence

docs_dir: docs
site_dir: site
use_directory_urls: true

hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Follow the system theme }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/brightness-4, name: Switch to light mode }
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tooltips

extra_css:
  - assets/fastmm.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ziyangliu-666/FastMM
      name: FastMM on GitHub

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Static analysis (griffe): the site builds without compiling fastmm._core.
          paths: [python]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            heading_level: 3
            merge_init_into_class: true
            extensions:
              - tools/griffe_fastmm.py:EscapeStubBrackets

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's anchor rules, so a `#fragment` works both here and on GitHub
      # (tools/docs_links.py checks the GitHub spelling).
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# `mkdocs build --strict` turns each of these into a build failure.
validation:
  nav:
    omitted_files: warn # a new page under docs/ needs a nav entry here
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

