# The fastmm-engine-live distribution: the network stack, venue connectors and the live runtime as
# fastmm_live._live, built from the same CMake tree as fastmm. Build from the repository root:
#   pip wheel ./python/live --no-deps -w dist
# OpenSSL is linked statically by default; OPENSSL_ROOT_DIR selects the installation
# (scripts/wheels/build-openssl.sh), FASTMM_OPENSSL_STATIC=OFF links the shared libraries.
[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "fastmm-engine-live"
dynamic = ["version", "dependencies"]
description = "Live trading runtime for fastmm: network stack, venue connectors, OpenSSL"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.scikit-build]
cmake.version = ">=3.25"
cmake.source-dir = "../.."
cmake.build-type = "Release"
build-dir = "../../build/py-live-{wheel_tag}"
wheel.packages = ["fastmm_live"]
install.components = ["python"]

[tool.scikit-build.cmake.define]
FASTMM_BUILD_PYTHON = "OFF"
FASTMM_BUILD_PYTHON_LIVE = "ON"
FASTMM_BUILD_NET = "ON"
FASTMM_BUILD_TESTS = "OFF"
FASTMM_BUILD_BENCH = "OFF"
FASTMM_BUILD_APPS = "OFF"
FASTMM_BUILD_EXAMPLES = "OFF"
FASTMM_INSTALL = "OFF"
FASTMM_OPENSSL_STATIC = { env = "FASTMM_OPENSSL_STATIC", default = "ON" }

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../CMakeLists.txt"
regex = "project\\(fastmm\\s+VERSION\\s+(?P<value>[0-9.]+)"

[tool.scikit-build.metadata.dependencies]
provider = "scikit_build_core.metadata.template"
result = ["fastmm-engine=={project[version]}", "certifi"]
