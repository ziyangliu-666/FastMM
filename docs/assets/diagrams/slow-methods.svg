<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d">
<title id="t">Slow methods move the quotes only through publish</title>
<desc id="d">The hot hooks on_book and on_params run on the engine thread, which alone exchanges market data and orders with the venue. The slow thread runs on_start, the @fastmm.every methods and on_stop in Python. The engine publishes a snapshot at most every 10 ms, the recent rows and a ring of fills towards the slow thread; the slow thread sends parameter values back through the publish ring, and on_params then requotes.</desc>
