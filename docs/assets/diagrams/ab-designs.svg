<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d">
<title id="t">Which arm each instrument runs, block by block</title>
<desc id="d">Three assignments of two arms, A and B, over four instruments and six blocks. instrument: each instrument keeps one arm, each pair of instruments has one of each. time: every instrument is in the same arm, which changes each block, each run of two blocks giving each arm one block. crossover: each instrument changes arm every block, and in every block half the instruments are in each arm.</desc>
