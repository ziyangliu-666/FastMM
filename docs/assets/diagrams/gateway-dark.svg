<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 632" width="720" height="632" role="img" aria-labelledby="t d">
<title id="t">Every order passes the account guards</title>
<desc id="d">fastmm-gateway holds the venue connection and the API keys: market data comes in from the venue and orders go out to it. Its network thread runs the connector, a copy of every book and the account guards. Each attached fastmm-live process, here mm-btc and hedger, gets three rings in shared memory per venue: market data and order events towards its engine thread, and its orders back to the gateway, where they pass the account guards before they reach the venue. A strategy attaches and detaches through the attach socket on the gateway main thread.</desc>
