[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "fastmm-engine"
dynamic = ["version"]
description = "Low-latency market-making engine: backtest and trade Python and C++ strategies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ziyangliu-666/FastMM"
Documentation = "https://ziy.bio/FastMM/"
Repository = "https://github.com/ziyangliu-666/FastMM"
Changelog = "https://github.com/ziyangliu-666/FastMM/blob/main/CHANGELOG.md"
Issues = "https://github.com/ziyangliu-666/FastMM/issues"

[project.scripts]
# `fastmm init`, `fastmm report` and `fastmm run`, the same entry point as `python -m fastmm`.
fastmm = "fastmm.__main__:main"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
plot = ["matplotlib>=3.7"]
# Hot hooks (@fastmm.hot), and pandas for the DataFrames of results. Tested with numba 0.61.2 and
# 0.67.0.
hot = ["numba>=0.61,<0.68", "llvmlite>=0.44,<0.50", "pandas>=2.0"]
# Same version as fastmm (python/tests/test_packaging.py checks it).
live = ["fastmm-engine-live==0.8.0"]
dev = ["pytest>=7", "pandas>=2.0", "pybind11-stubgen"]

[tool.scikit-build]
cmake.version = ">=3.25"
cmake.build-type = "Release"
build-dir = "build/py-{wheel_tag}"
wheel.packages = ["python/fastmm"]
sdist.include = ["cmake/", "include/", "src/", "python/", "CMakeLists.txt", "CMakePresets.json"]
editable.mode = "redirect"
install.components = ["python"]

[tool.scikit-build.cmake.define]
FASTMM_BUILD_PYTHON = "ON"
FASTMM_BUILD_TESTS = "OFF"
FASTMM_BUILD_BENCH = "OFF"
FASTMM_BUILD_APPS = "OFF"
FASTMM_BUILD_EXAMPLES = "OFF"
FASTMM_BUILD_NET = "OFF"
FASTMM_INSTALL = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = "project\\(fastmm\\s+VERSION\\s+(?P<value>[0-9.]+)"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
