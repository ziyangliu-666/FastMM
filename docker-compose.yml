services:
  sim-exchange:
    build: { context: ., dockerfile: docker/Dockerfile }
    entrypoint: ["fastmm-sim-exchange"]
    command: ["--config", "/fastmm/configs/sim.toml", "--bind", "0.0.0.0",
              "--tls-cert", "/fastmm/tls/cert.pem", "--tls-key", "/fastmm/tls/key.pem"]
    environment:
      - FASTMM_SIM_API_KEY=${FASTMM_SIM_API_KEY:-sim-key}
      - FASTMM_SIM_API_SECRET=${FASTMM_SIM_API_SECRET:-sim-secret}
    ports: ["9080:9080", "9443:9443"]
    healthcheck: { test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"], interval: 2s, retries: 10 }
  engine:
    build: { context: ., dockerfile: docker/Dockerfile }
    depends_on: { sim-exchange: { condition: service_healthy } }
    command: ["--config", "/fastmm/configs/sim-docker.toml", "--duration", "120s"]
    environment:
      - FASTMM_SIM_API_KEY=${FASTMM_SIM_API_KEY:-sim-key}
      - FASTMM_SIM_API_SECRET=${FASTMM_SIM_API_SECRET:-sim-secret}
    volumes: ["./runs:/fastmm/runs"]
