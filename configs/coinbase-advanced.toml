# FastMM: BasicMM on Coinbase Advanced Trade, BTC-USD spot. Production: Advanced Trade has no test
# environment with matching, so start with a dry run (public market data, no orders):
#   ./build/release/bin/fastmm-live --config configs/coinbase-advanced.toml --dry-run --duration 60s
# Keys: a CDP API key (https://portal.cdp.coinbase.com, API keys, Secret API Keys) with the ECDSA
# signature algorithm and the View and Trade permissions. Its name ("organizations/<org>/apiKeys/
# <id>") and private key ("-----BEGIN EC PRIVATE KEY-----...", newlines or "\n" escapes):
#   export COINBASE_API_KEY_NAME=... COINBASE_API_PRIVATE_KEY=...
#   ./build/release/bin/fastmm-live --config configs/coinbase-advanced.toml
# Endpoints: REST https://api.coinbase.com/api/v3/brokerage, public feed
# wss://advanced-trade-ws.coinbase.com, user channel wss://advanced-trade-ws-user.coinbase.com.
[engine]
name = "coinbase-advanced"
cpu = -1
net_cpus = []
spin_mode = "adaptive"
journal = true
journal_dir = "runs"
epoch_file = "runs/session_epoch"
rng_seed = 42
md_ring_bytes = 16777216     # a snapshot carries 1024 levels a side
order_ring_bytes = 1048576
journal_ring_bytes = 16777216
max_events_per_step = 64
crossed_grace_ms = 100
latency_publish_ms = 1000
min_requote_ticks = 50
min_requote_interval_ms = 1000
min_qty_bps = 8000
post_only = true
supports_replace = false     # the connector sends cancel and new

[venues.coinbase]
kind = "coinbase_advanced"
ws_url = "wss://advanced-trade-ws.coinbase.com"
rest_url = "https://api.coinbase.com"
api_key = "${COINBASE_API_KEY_NAME}"
api_secret = "${COINBASE_API_PRIVATE_KEY}"
testnet = false              # production: there is no test environment
supports_replace = false

[venues.coinbase.fees]
maker_bps = 40.0             # the lowest volume tier; the account's own rates may differ
taker_bps = 60.0

# Tick, lot, minimum size and minimum notional are overwritten from the product at startup.
[[instruments]]
venue = "coinbase"
symbol = "BTC-USD"
base = "BTC"
quote = "USD"
asset_class = "spot"
tick = "0.01"
lot = "0.00000001"
min_qty = "0.00000001"
min_notional = "1"
enabled = true

[strategy]
name = "basic_mm"

[strategy.params]
half_spread_bps = 50.0
skew_bps_per_unit = 5.0
quote_qty = 0.0001
max_inventory = 0.0005
requote_threshold_ticks = 500
pull_on_stale_ms = 2000
levels = 1

[risk]
max_order_qty = "0.0002"
max_order_notional = "30"
max_position = "0.0006"
max_open_orders = 4
price_collar_bps = 100
fat_finger_bps = 300
stale_md_ms = 2000
max_loss = "10"
orders_per_sec = 4
burst = 4
stp = true

[logging]
level = "info"
file = ""
mirror_level = "warn"
