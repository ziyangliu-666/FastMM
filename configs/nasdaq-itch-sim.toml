# FastMM: BasicMM on Nasdaq TotalView-ITCH from fastmm-sim-itch, orders over OUCH 5.0 (sim_ouch).
# Both processes need a network namespace whose lo carries multicast (docs/reference/sim-itch.md):
#   unshare -Urn sh -c 'ip link set lo up multicast on && ip route add 224.0.0.0/4 dev lo &&
#     (./build/release/bin/fastmm-sim-itch --config configs/sim-itch.toml &) && sleep 1 &&
#     ./build/release/bin/fastmm-live --config configs/nasdaq-itch-sim.toml --duration 30s'
# scripts/bench-e2e.sh runs the same over a veth pair between two namespaces.

[engine]
name = "nasdaq-itch-sim"
cpu = -1                     # pin the engine thread on bare metal
net_cpus = []                # one entry per venue when pinning
spin_mode = "adaptive"       # "busy": the venue polls its sockets on every loop iteration
journal = false
journal_dir = "runs"
epoch_file = "runs/session_epoch"
rng_seed = 42
md_ring_bytes = 4194304
order_ring_bytes = 1048576
max_events_per_step = 64
crossed_grace_ms = 100
latency_publish_ms = 1000
min_requote_ticks = 1
min_requote_interval_ms = 0  # requote on every mid move of a tick
min_qty_bps = 8000
post_only = false
supports_replace = true

# --8<-- [start:venue]
[venues.itch]
kind = "nasdaq_itch"
rx_backend = "kernel"        # kernel | af_xdp (needs capabilities, docs/how-to/operations/multicast-feeds.md)
interface = "lo"             # both lines; line_a_interface / line_b_interface override
line_a = "239.192.0.1:31001"
line_b = "239.192.0.2:31002"
rerequest = "127.0.0.1:31000"
glimpse_url = "127.0.0.1:31010"
glimpse_username = "glimps"  # the simulator's defaults ([sim.glimpse] in configs/sim-itch.toml)
glimpse_password = "glimpse"
reorder_packets = 256
gap_timeout_ns = 2000000
max_request_attempts = 4
recovery_buffer_packets = 65536
depth = 20
order_entry = "sim_ouch"     # none: every order is rejected
ouch_url = "127.0.0.1:31020"
ouch_username = "fmouch"
ouch_password = "ouch"
supports_replace = true
# --8<-- [end:venue]

[[instruments]]
venue = "itch"
symbol = "FMAA"
asset_class = "equity"
tick = "0.01"
lot = "1"
min_qty = "1"
max_qty = "10000"
enabled = true

[[instruments]]
venue = "itch"
symbol = "FMBB"
asset_class = "equity"
tick = "0.01"
lot = "1"
min_qty = "1"
max_qty = "10000"
enabled = true

[strategy]
name = "basic_mm"

[strategy.params]
half_spread_bps = 1.0        # 1 bp of $100 is one tick: quotes join or improve the touch
skew_bps_per_unit = 0.0
quote_qty = 100
max_inventory = 2000
requote_threshold_ticks = 1
pull_on_stale_ms = 0
levels = 1

[risk]
max_order_qty = "1000"
max_order_notional = "200000"
max_position = "5000"
max_open_orders = 8
price_collar_bps = 200
fat_finger_bps = 1000
stale_md_ms = 5000
max_loss = "100000"
orders_per_sec = 500
burst = 100
stp = true

[logging]
level = "info"
file = ""
mirror_level = "warn"
