# FastMM: BasicMM on a Lighter perpetual (mainnet hosts; the testnet is wss://testnet.zklighter.elliot.ai/stream
# and https://testnet.zklighter.elliot.ai with testnet = true).
#   ./build/release/bin/fastmm-live --config configs/lighter.toml --dry-run --duration 60s
# With keys: the account index, an API key registered in a slot of the account (tools/lighter_api_key.py) and
# that slot:
#   export FASTMM_LIGHTER_ACCOUNT=123456 FASTMM_LIGHTER_API_KEY=<80 hex digits>
#   ./build/release/bin/fastmm-live --config configs/lighter.toml
# The client order index of every order is the engine's client order id: trade the account (or a
# sub-account) through FastMM only. Leverage and margin mode are account settings the connector does
# not touch.
[engine]
name = "lighter"
cpu = -1
net_cpus = []
spin_mode = "adaptive"
journal = true
journal_dir = "runs"
epoch_file = "runs/session_epoch"
rng_seed = 42
md_ring_bytes = 4194304
order_ring_bytes = 1048576
journal_ring_bytes = 16777216
max_events_per_step = 64
crossed_grace_ms = 100
latency_publish_ms = 1000
min_requote_ticks = 2
min_requote_interval_ms = 250
min_qty_bps = 8000
post_only = true
# A modify (ModifyOrder) keeps the order and spends volume quota like a new order.
supports_replace = true

[venues.lt]
kind = "lighter"
ws_url = "wss://mainnet.zklighter.elliot.ai/stream"
rest_url = "https://mainnet.zklighter.elliot.ai"
api_key = "${FASTMM_LIGHTER_ACCOUNT}"
api_secret = "${FASTMM_LIGHTER_API_KEY}"
api_key_index = 4
testnet = false
supports_replace = true
stale_ms = 10000
# A Standard account may send 60 transactions a minute, a Premium one 4000 (more with LIT staked).
tx_per_minute = 60
# Premium: new orders and modifies stop while no more than this much volume quota remains.
quota_reserve = 100
# A scheduled CancelAll: the venue cancels every order of the account when no refresh arrives in
# time. At least 310 (the venue wants the time 5 minutes ahead). 0 = off.
dead_mans_switch_s = 600

[venues.lt.fees]
maker_bps = 0.0              # Standard account; Premium is 0.4 maker, 2.8 taker before LIT staking
taker_bps = 0.0

# Tick (10^-price_decimals), lot (10^-size_decimals), the minimum size and the minimum quote come
# from orderBookDetails at startup; quote = USDC.
[[instruments]]
venue = "lt"
symbol = "NVDA"
base = "NVDA"
quote = "USDC"
asset_class = "perpetual"
tick = "0.001"
lot = "0.001"
min_qty = "0.025"
max_qty = "100"
enabled = true

[strategy]
name = "basic_mm"

[strategy.params]
half_spread_bps = 5.0
skew_bps_per_unit = 20.0
quote_qty = 0.05
max_inventory = 0.15
requote_threshold_ticks = 20
pull_on_stale_ms = 2000
levels = 1

[risk]
max_order_qty = "0.1"
max_order_notional = "50"
max_position = "0.15"
max_open_orders = 4
price_collar_bps = 50
fat_finger_bps = 200
stale_md_ms = 2000
max_loss = "5"
orders_per_sec = 1
burst = 2
stp = true

[logging]
level = "info"
file = ""
mirror_level = "warn"
