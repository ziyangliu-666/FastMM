# FastMM: backtest on Binance public data (docs/how-to/backtesting/binance-public-data.md).
#
#   python3 -m fastmm.data fetch --symbol BTCUSDT --date 2024-03-27
#   ./build/release/bin/fastmm-backtest --config configs/backtest-binance.toml \
#       --data binance:BTCUSDT,2024-03-27
#
# The feed is bookTicker plus aggTrades: the top of book and every trade, nothing deeper. Read
# what that lets a result mean before believing one - the source carries no depth, so an order
# away from the touch is modelled as alone at its price.

[engine]
name = "backtest-binance"
spin_mode = "busy"
journal = false
rng_seed = 1
max_events_per_step = 256
crossed_grace_ms = 100
min_requote_ticks = 1
min_requote_interval_ms = 50
min_qty_bps = 8000
post_only = true
supports_replace = false

[venues.binance-usdm]
kind = "sim"
supports_replace = false

# Binance USDⓈ-M futures VIP 0: 0.0200 % maker and 0.0500 % taker, i.e. 2 bps and 5 bps
# (https://www.binance.com/en/fee/futureFee). Positive == a fee the account pays. The 10 %
# BNB discount is not applied. A passive quoter on this instrument pays 2 bps per fill and has
# to capture more than that before anything is left.
[venues.binance-usdm.fees]
maker_bps = 2.0
taker_bps = 5.0

# BTCUSDT perpetual as the venue lists it: tick 0.10 USDT, step 0.001 BTC, 100 USDT minimum
# notional. The symbol matches the data source's `symbol=`, which is how the source finds the
# instrument id.
[[instruments]]
venue = "binance-usdm"
symbol = "BTCUSDT"
base = "BTC"
quote = "USDT"
asset_class = "perp"
tick = "0.1"
lot = "0.001"
min_qty = "0.001"
min_notional = "100"

[strategy]
name = "basic_mm"

# One level at the touch. The data has no depth, so quoting behind the touch would be modelled
# with an empty queue in front of the order and the fills would be fiction.
[strategy.params]
half_spread_bps = 0.007
skew_bps_per_unit = 2.0
quote_qty = 0.002
max_inventory = 0.02
requote_threshold_ticks = 1
pull_on_stale_ms = 0
levels = 1
level_step_ticks = 1

[risk]
max_order_qty = "0.01"
max_order_notional = "5000"
max_position = "0.05"
max_open_orders = 8
price_collar_bps = 200
fat_finger_bps = 1000
stale_md_ms = 0
max_loss = "500"
stp = true

[logging]
level = "warn"

[backtest]
source = "binance:BTCUSDT,2024-03-27"   # --data overrides this
fill_model = "l2_queue"       # the only honest model for recorded data: no counterparties
queue_conservatism = 1.0      # a cancel ahead of us never shortens the queue
latency_fixed_us = 5000       # a colocated retail link to Binance, round trip
latency_jitter_us = 2000
latency_md_us = 5000
equity_bar_s = 60
initial_capital = 10000
markout_horizons_s = "1,10,60"
output_dir = "runs/binance"
