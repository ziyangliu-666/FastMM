# FastMM: BasicMM on Alpaca's paper account, SPY on the free IEX feed.
#   export ALPACA_API_KEY=... ALPACA_API_SECRET=...
#   ./build/release/bin/fastmm-live --config configs/alpaca-paper.toml
# Endpoints: REST https://paper-api.alpaca.markets/v2, trade_updates
# wss://paper-api.alpaca.markets/stream, market data wss://stream.data.alpaca.markets/v2/iex.
# How-to: docs/how-to/venues/trade-us-stocks-on-alpaca.md.
[engine]
name = "alpaca-paper"
cpu = -1
net_cpus = []
spin_mode = "adaptive"
journal = true
journal_dir = "runs"
epoch_file = "runs/session_epoch"
rng_seed = 42
md_ring_bytes = 4194304
order_ring_bytes = 1048576
journal_ring_bytes = 16777216
max_events_per_step = 64
crossed_grace_ms = 100
latency_publish_ms = 1000
min_requote_ticks = 3
min_requote_interval_ms = 2000   # Alpaca allows 200 requests a minute per account
post_only = false                # Alpaca has no post-only order
supports_replace = true          # PATCH /v2/orders/<id>

[venues.alpaca]
kind = "alpaca"
ws_url = "wss://stream.data.alpaca.markets/v2/iex"
rest_url = "https://paper-api.alpaca.markets"
ws_private_url = "wss://paper-api.alpaca.markets/stream"
api_key = "${ALPACA_API_KEY}"
api_secret = "${ALPACA_API_SECRET}"
testnet = true
supports_replace = true
time_in_force = "day"
extended_hours = false

# Tick and lot are set from the asset at startup: $0.01, one share.
[[instruments]]
venue = "alpaca"
symbol = "SPY"
base = "SPY"
quote = "USD"
asset_class = "equity"
tick = "0.01"
lot = "1"
min_qty = "1"
min_notional = "1"
enabled = true

[strategy]
name = "basic_mm"

[strategy.params]
half_spread_bps = 2.0
skew_bps_per_unit = 0.5
quote_qty = 1
max_inventory = 5
requote_threshold_ticks = 3
pull_on_stale_ms = 30000
levels = 1

[risk]
max_order_qty = "2"
max_order_notional = "2000"
max_position = "6"
max_open_orders = 4
price_collar_bps = 100
fat_finger_bps = 300
stale_md_ms = 30000
max_loss = "200"
orders_per_sec = 2
burst = 4
stp = true

[logging]
level = "info"
file = ""
mirror_level = "warn"
