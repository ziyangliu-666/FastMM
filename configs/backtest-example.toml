# FastMM: in-process backtest of BasicMM over a journal / CSV data source.
#   ./build/release/apps/fastmm-backtest --config configs/backtest-example.toml --data tests/fixtures/journals/sample_1000.fmj

[engine]
name = "backtest-example"
spin_mode = "busy"
journal = false
rng_seed = 1
max_events_per_step = 256
crossed_grace_ms = 100
min_requote_ticks = 1
min_requote_interval_ms = 50
min_qty_bps = 8000
post_only = true
supports_replace = false     # cancel-then-new, the conservative path

[venues.sim]
kind = "sim"
supports_replace = false

[venues.sim.fees]
maker_bps = -0.5
taker_bps = 3.0

[[instruments]]
venue = "sim"
symbol = "BTCUSDT"
base = "BTC"
quote = "USDT"
asset_class = "spot"
tick = "0.01"
lot = "0.00001"
min_qty = "0.00001"
min_notional = "5"

[strategy]
name = "basic_mm"

[strategy.params]
half_spread_bps = 3.0
skew_bps_per_unit = 0.5
quote_qty = 0.002
max_inventory = 0.02
requote_threshold_ticks = 2
pull_on_stale_ms = 0
levels = 2
level_step_ticks = 5

[risk]
max_order_qty = "0.01"
max_order_notional = "2000"
max_position = "0.05"
max_open_orders = 8
price_collar_bps = 200
fat_finger_bps = 1000
stale_md_ms = 0
max_loss = "100"
stp = true

[logging]
level = "warn"

[backtest]
fill_model = "l2_queue"      # matching | l2_queue
queue_conservatism = 1.0
latency_fixed_us = 200
latency_jitter_us = 50
output_dir = "runs/backtest"
equity_bar_s = 1
