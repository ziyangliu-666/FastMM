# FastMM: in-process backtest of BasicMM (8.4).
#
#   ./build/release/bin/fastmm-backtest --config configs/backtest-example.toml --data synthetic
#   ./build/release/bin/fastmm-backtest --config configs/backtest-example.toml \
#       --data tests/fixtures/journals/sample_1000.fmj --out runs/bt-fixture
#   ./build/release/bin/fastmm-replay --journal tests/fixtures/journals/sample_1000.fmj --verify
#
# The strategy / [sim] / [backtest] values below are also the inputs of the golden fixture
# hash (tests/fixtures/journals/sample_1000.sha256); regenerate it when changing them (see
# tests/backtest/replay_determinism_test.cpp).

[engine]
name = "backtest-example"
spin_mode = "busy"
journal = false
rng_seed = 1
max_events_per_step = 256
crossed_grace_ms = 100
min_requote_ticks = 1
min_requote_interval_ms = 50
min_qty_bps = 8000
post_only = true
supports_replace = false     # cancel-then-new, the conservative path

[venues.sim]
kind = "sim"
supports_replace = false

[venues.sim.fees]
maker_bps = -0.5
taker_bps = 3.0

[[instruments]]
venue = "sim"
symbol = "BTCUSDT"
base = "BTC"
quote = "USDT"
asset_class = "spot"
tick = "0.01"
lot = "0.00001"
min_qty = "0.00001"
min_notional = "5"

[strategy]
name = "basic_mm"

# BasicMM works in centi-bps of mid: at 60000, 0.01 bps = 0.06 = 6 ticks. Skewed quotes are kept
# one tick inside the touch, so the inventory cap can hold several quote sizes and both sides stay
# quoted most of the time.
[strategy.params]
half_spread_bps = 0.01
skew_bps_per_unit = 0.01
quote_qty = 0.002
max_inventory = 0.01
requote_threshold_ticks = 2
pull_on_stale_ms = 0
levels = 1
level_step_ticks = 5

[risk]
max_order_qty = "0.01"
max_order_notional = "2000"
max_position = "0.05"
max_open_orders = 8
price_collar_bps = 200
fat_finger_bps = 1000
stale_md_ms = 0
max_loss = "100"
stp = true

[logging]
level = "warn"

# Synthetic market (--data synthetic): MarketGenerator parameters.
[sim]
seed = 1
start_mid = "60000"
depth_update_ms = 100
limit_rate_per_s = 400.0
limit_qty_median_lots = 300.0
market_rate_per_s = 30.0
market_qty_median_lots = 1500.0
mid_step_rate_per_s = 20.0
offset_p = 0.2
seed_levels = 20

[backtest]
fill_model = "l2_queue"      # matching | l2_queue
queue_conservatism = 0.5     # 0 = cancels ahead always help, 1 = never
latency_fixed_us = 200
latency_jitter_us = 50
duration_s = 60              # synthetic horizon
equity_bar_s = 1
initial_capital = 10000
output_dir = "runs/backtest"
