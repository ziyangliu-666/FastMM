# FastMM: BasicMM on Gate USDT-settled perpetual futures (production hosts; Gate's futures
# TestNet is wss://ws-testnet.gate.com/v4/ws/futures/usdt and https://fx-api-testnet.gateio.ws
# with TestNet keys from "Futures TestNet APIKeys").
#   ./build/release/bin/fastmm-live --config configs/gate-usdt.toml --dry-run --duration 60s
# With keys (APIv4 key with futures read-write; the account must be in single position mode and
# hold USDT in the futures account):
#   export FASTMM_GATE_API_KEY=... FASTMM_GATE_API_SECRET=...
#   ./build/release/bin/fastmm-live --config configs/gate-usdt.toml
# Endpoints (https://www.gate.com/docs/developers/futures/ws/en/): one WebSocket URL for the
# public channels, the private channels and the order API (futures.login), REST
# https://fx-api.gateio.ws/api/v4/futures/usdt. Quantities are contracts (quanto_multiplier of
# the base coin each); leverage and margin mode are account settings the connector does not touch.
[engine]
name = "gate-usdt"
cpu = -1
net_cpus = []
spin_mode = "adaptive"
journal = true
journal_dir = "runs"
epoch_file = "runs/session_epoch"
rng_seed = 42
md_ring_bytes = 4194304
order_ring_bytes = 1048576
journal_ring_bytes = 16777216
max_events_per_step = 64
crossed_grace_ms = 100
latency_publish_ms = 1000
min_requote_ticks = 2
min_requote_interval_ms = 250
min_qty_bps = 8000
post_only = true
supports_replace = false

[accounting]
# A quiet contract's tickers push (mark, index, funding) can be 15 s apart.
stale_mark_ms = 60000

[venues.gate_usdt]
kind = "gate_usdt"
ws_url = "wss://fx-ws.gateio.ws/v4/ws/usdt"
rest_url = "https://fx-api.gateio.ws"
api_key = "${FASTMM_GATE_API_KEY}"
api_secret = "${FASTMM_GATE_API_SECRET}"
testnet = false
# Amend is implemented (futures.order_amend keeps the order, a size increase loses its place in
# the queue); quotes are replaced with cancel + new until it has been watched on the venue.
supports_replace = false
book_level = 50
stale_ms = 10000
# POST /countdown_cancel_all: the venue cancels every order of the account when no refresh
# arrives within this many seconds. 0 = off.
dead_mans_switch_s = 30

[venues.gate_usdt.fees]
maker_bps = 2.0              # VIP 0 futures rates: 0.02 % maker, 0.05 % taker (market makers: -0.01 %)
taker_bps = 5.0

# Tick, lot (1 contract), minimum/maximum size and the multiplier are overwritten from
# GET /futures/usdt/contracts at startup; base = BTC, quote = USDT.
[[instruments]]
venue = "gate_usdt"
symbol = "BTC_USDT"
base = "BTC"
quote = "USDT"
asset_class = "perpetual"
tick = "0.1"
lot = "1"
min_qty = "1"
max_qty = "1000000"
contract_multiplier = "0.0001"
enabled = true

[strategy]
name = "basic_mm"

[strategy.params]
half_spread_bps = 5.0
skew_bps_per_unit = 0.5
quote_qty = 1
max_inventory = 3
requote_threshold_ticks = 3
pull_on_stale_ms = 2000
levels = 1

[risk]
max_order_qty = "2"
max_order_notional = "50"
max_position = "3"
max_open_orders = 4
price_collar_bps = 50
fat_finger_bps = 200
stale_md_ms = 2000
max_loss = "5"
orders_per_sec = 5
burst = 5
stp = true

[logging]
level = "info"
file = ""
mirror_level = "warn"
