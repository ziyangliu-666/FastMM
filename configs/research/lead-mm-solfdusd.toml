# FastMM: lead_mm on SOLFDUSD, priced off SOLUSDT converted by FDUSDUSDT, backtested on a journal
# recorded by fastmm-live.
#
#   ./build/release/bin/fastmm-backtest --config configs/research/lead-mm-solfdusd.toml \
#       --data journal:runs/<session>.fmj
#
# A journal's events carry instrument ids, not symbols: the [[instruments]] below must be listed in
# the order the recording session listed them (SOLFDUSD, SOLUSDT, FDUSDUSDT), and the strategy's
# target / leader / fx are indices into that order. SOLUSDT and FDUSDUSDT are enabled = false:
# their books are kept and read, and risk refuses any order on them.

[engine]
name = "lead-mm-solfdusd"
spin_mode = "busy"
journal = false
rng_seed = 1
max_events_per_step = 256
crossed_grace_ms = 100
min_requote_ticks = 1
min_requote_interval_ms = 50
min_qty_bps = 8000
post_only = true
supports_replace = false

[venues.binance]
kind = "sim"
supports_replace = false

# FDUSD pairs: 0 maker; taker 10 bps (never paid by a post-only quoter, kept for honesty).
[venues.binance.fees]
maker_bps = 0.0
taker_bps = 10.0

[[instruments]]
venue = "binance"
symbol = "SOLFDUSD"
base = "SOL"
quote = "FDUSD"
asset_class = "spot"
tick = "0.01"
lot = "0.001"
min_qty = "0.001"
min_notional = "5"

[[instruments]]
venue = "binance"
symbol = "SOLUSDT"
base = "SOL"
quote = "USDT"
asset_class = "spot"
tick = "0.01"
lot = "0.001"
min_qty = "0.001"
min_notional = "5"
enabled = false

[[instruments]]
venue = "binance"
symbol = "FDUSDUSDT"
base = "FDUSD"
quote = "USDT"
asset_class = "spot"
tick = "0.0001"
lot = "1"
min_qty = "1"
min_notional = "5"
enabled = false

[strategy]
name = "lead_mm"

# fair = SOLUSDT mid / FDUSDUSDT mid, in FDUSD per SOL. 0.05 SOL is about 6-8 FDUSD per side.
[strategy.params]
target = 0
leader = 1
fx = 2
fx_invert = false
edge_min_bps = 0.3
hysteresis_bps = 0.1
skew_bps_per_unit = 0.2
quote_qty = 0.05
max_inventory = 0.1
max_leader_age_ms = 500
improve = false

[risk]
max_order_qty = "0.1"
max_order_notional = "50"
max_position = "0.2"
max_open_orders = 4
price_collar_bps = 200
fat_finger_bps = 1000
stale_md_ms = 0               # the target can be quiet for minutes; lead_mm checks the leader
max_loss = "20"
stp = true

[logging]
level = "warn"

[backtest]
fill_model = "l2_queue"
queue_conservatism = 1.0      # a cancel ahead of us never shortens the queue
latency_fixed_us = 5000
latency_jitter_us = 2000
latency_md_us = 5000
equity_bar_s = 60
initial_capital = 1000
markout_horizons_s = "1,10,60"
output_dir = "runs/lead-mm-solfdusd"
