# FastMM: BasicMM on Binance Spot Demo Mode (realistic, not real, market data; demo balances).
#   ./build/release/bin/fastmm-live --config configs/binance-demo.toml --dry-run --duration 60s
# Keys come from Binance Demo Trading (API Key Management after switching to Demo Trading);
# they are not testnet keys and not live keys:
#   export FASTMM_BINANCE_API_KEY=... FASTMM_BINANCE_API_SECRET=...
#   ./build/release/bin/fastmm-live --config configs/binance-demo.toml
# Endpoints: https://developers.binance.com/docs/binance-spot-api-docs/demo-mode/general-info
#   REST https://demo-api.binance.com, streams wss://demo-stream.binance.com,
#   WebSocket API wss://demo-ws-api.binance.com/ws-api/v3.
[engine]
name = "binance-demo"
cpu = -1                     # pin the engine thread on bare metal; -1 on WSL2
net_cpus = []
spin_mode = "adaptive"
journal = true
journal_dir = "runs"
epoch_file = "runs/session_epoch"
rng_seed = 42
md_ring_bytes = 4194304
order_ring_bytes = 1048576
journal_ring_bytes = 16777216
max_events_per_step = 64
crossed_grace_ms = 100
latency_publish_ms = 1000
min_requote_ticks = 50
min_requote_interval_ms = 1000
min_qty_bps = 8000
post_only = true
supports_replace = true

[venues.binance]
kind = "binance_spot"
ws_url = "wss://demo-stream.binance.com/stream"
ws_api_url = "wss://demo-ws-api.binance.com/ws-api/v3"
rest_url = "https://demo-api.binance.com"
api_key = "${FASTMM_BINANCE_API_KEY}"
api_secret = "${FASTMM_BINANCE_API_SECRET}"
testnet = true
supports_replace = true      # order.cancelReplace (STOP_ON_FAILURE)
recv_window_ms = 3000
# The 2 s default flags quiet Demo Mode spells as Stale (book clear + resync).
stale_ms = 10000
# Ed25519 key instead (docs/how-to/operations/run-on-testnet.md): orders go unsigned after
# session.logon, and md_format = "sbe" reads wss://demo-stream-sbe.binance.com. Drop api_secret.
# key_type = "ed25519"
# private_key_env = "FASTMM_BINANCE_ED25519_PEM"
# md_format = "sbe"

[venues.binance.fees]
maker_bps = 10.0
taker_bps = 10.0

# Tick/lot/min_notional are overwritten from GET /api/v3/exchangeInfo at startup.
[[instruments]]
venue = "binance"
symbol = "BTCUSDT"
base = "BTC"
quote = "USDT"
asset_class = "spot"
tick = "0.01"
lot = "0.00001"
min_qty = "0.00001"
max_qty = "9000"
min_notional = "5"
enabled = true

[strategy]
name = "basic_mm"

[strategy.params]
# Fee-aware defaults for Demo Mode: maker commission is 10 bps per fill, so a round trip at a 15 bps
# half spread keeps 10 bps before adverse selection. Requote thresholds are in 0.01 USDT ticks:
# at ~77,000 USDT, 100 ticks is about 1.3 bps.
half_spread_bps = 15.0
skew_bps_per_unit = 5.0
quote_qty = 0.0003
max_inventory = 0.003
requote_threshold_ticks = 100
pull_on_stale_ms = 2000
levels = 1

[risk]
max_order_qty = "0.001"
max_order_notional = "100"
max_position = "0.004"
max_open_orders = 4
price_collar_bps = 50
fat_finger_bps = 200
stale_md_ms = 2000
max_loss = "50"
orders_per_sec = 5
burst = 5
stp = true

[logging]
level = "info"
file = ""
mirror_level = "warn"
