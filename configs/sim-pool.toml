# fastmm-sim-exchange with a pool of five sub-accounts under one master account
# (docs/reference/sim-exchange.md#a-pool-of-accounts).
#   ./build/release/bin/fastmm-sim-exchange --config configs/sim-pool.toml
#
# Each [sim.accounts.<name>] is a Binance sub-account: its own key, email, balances, orders,
# order windows and user data streams. The [sim.master] key signs internal transfers between
# them (POST /sapi/v1/sub-account/universalTransfer) and trades nothing.

[venues.sim]
kind = "sim"

[[instruments]]
venue = "sim"
symbol = "BTCUSDT"
base = "BTC"
quote = "USDT"
asset_class = "spot"
tick = "0.01"
lot = "0.00001"
min_qty = "0.00001"
max_qty = "100"
min_notional = "5"
enabled = true

[sim]
seed = 7
start_mid = "60000"
bind = "127.0.0.1"
port = 9080
tls_port = 9443
tls_cert = "tests/fixtures/tls/cert.pem"
tls_key = "tests/fixtures/tls/key.pem"
depth_update_ms = 100

# The accounts, in ascending name order. An account without balances starts with 100 of each base
# asset and 10,000,000 of each quote asset. ed25519_public_key_file = "<pem>" makes a key Ed25519.
[sim.accounts.pool1]
api_key = "pool1-key"
api_secret = "pool1-secret"
email = "pool1@sim.local"
balances.BTC = "2"
balances.USDT = "200000"

[sim.accounts.pool2]
api_key = "pool2-key"
api_secret = "pool2-secret"
email = "pool2@sim.local"
balances.BTC = "0"
balances.USDT = "200000"

[sim.accounts.pool3]
api_key = "pool3-key"
api_secret = "pool3-secret"
email = "pool3@sim.local"
balances.BTC = "0"
balances.USDT = "200000"

[sim.accounts.pool4]
api_key = "pool4-key"
api_secret = "pool4-secret"
email = "pool4@sim.local"
balances.BTC = "0"
balances.USDT = "200000"

[sim.accounts.pool5]
api_key = "pool5-key"
api_secret = "pool5-secret"
email = "pool5@sim.local"
balances.BTC = "0"
balances.USDT = "200000"

[sim.master]
# A transfer without fromEmail or toEmail uses the master's own wallet.
api_key = "master-key"
api_secret = "master-secret"
email = "master@sim.local"
balances.USDT = "0"

[sim.fees]
maker_bps = 1.0
taker_bps = 4.0

[sim.limits]
weight_per_minute = 6000
orders_per_10s = 100         # each account's own ORDERS windows, as on Binance
orders_per_day = 200000
uid_weight_per_minute = 180000  # the master's /sapi/ UID weight; a transfer costs 360

[sim.faults]
# Internal transfers; the draws follow the seed.
transfer_p_fail = 0.0          # refused (-1000), nothing moves
transfer_p_lost = 0.0          # carried out; the answer is dropped or a 503, by turns
transfer_delay_ms = 0          # carried out this long after the request
transfer_ban_after = 0         # more than N in a minute answer 429 / -1003 (0: off)
transfer_refused_assets = []   # always refused with -9000
