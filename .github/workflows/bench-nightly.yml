name: bench-nightly
# Manual only: hosted-runner numbers are advisory, and a daily 40-minute run would spend most of a
# private repository's Actions minutes. Add a schedule back (e.g. weekly) if the repository is public.
on:
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-13 ninja-build libssl-dev zlib1g-dev && cmake --version
      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: bench (release, portable flags; hosted runners are noisy)
        run: CPM_SOURCE_CACHE=~/.cache/CPM ./scripts/bench.sh --preset release --cpu 1 --min-time 0.2s
      - name: compare to baseline (advisory)
        run: python3 tools/bench_compare.py bench/results/baseline-ci bench/results/latest || true
      - name: budgets (same three-times-the-budget gate as the CI subset)
        run: python3 tools/check_budgets.py bench/results/latest --slack 2
      - uses: actions/upload-artifact@v4
        with: { name: bench-results, path: bench/results/latest }
