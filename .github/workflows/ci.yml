name: CI
# Pushes and pull requests run lint, the gcc release build with tests, and the Python wheel; a push
# that only changes documentation runs lint alone. clang-tidy, the sanitizer builds, the clang build
# and the Docker smoke test run weekly and on manual dispatch ("Run workflow").
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CPM_SOURCE_CACHE: ~/.cache/CPM
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      code: ${{ steps.plan.outputs.code }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          gcc_release='{"name":"gcc-release","preset":"release","cxx":"g++-13","pkgs":"g++-13"}'
          others='{"name":"gcc-asan","preset":"asan","cxx":"g++-13","pkgs":"g++-13"},{"name":"clang-release","preset":"clang-release","cxx":"clang++-18","pkgs":"clang-18 lld-18"},{"name":"clang-tsan","preset":"clang-tsan","cxx":"clang++-18","pkgs":"clang-18 lld-18"}'
          full=false; code=true; matrix="[$gcc_release]"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            full=true; matrix="[$gcc_release,$others]"
          elif [ "$EVENT" = push ]; then
            # Unknown ranges (first push, force push) count as code changes.
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') && [ -n "$files" ]; then
              echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE)$' || code=false
            fi
          fi
          { echo "full=$full"; echo "code=$code"; echo "matrix=$matrix"; } >> "$GITHUB_OUTPUT"
          echo "full=$full code=$code"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: clang-format
        run: CLANG_FORMAT=clang-format-18 ./scripts/format.sh --check
      - name: generated SBE flyweights are up to date
        run: >-
          python3 tools/sbe_gen.py generate --schema tools/sbe/mdp3_templates_subset.xml
          --schema-label tools/sbe/mdp3_templates_subset.xml
          --out include/fastmm/codecs/mdp3/generated/mdp3_schema.hpp
          --namespace fastmm::codecs::mdp3::schema --check
      - name: forbidden patterns
        run: |
          ! grep -rnE 'dynamic_cast|std::cout' include src || (echo "forbidden pattern in hot-path code" && exit 1)
          ! grep -rnE 'TEST_CASE\("[^"]*;' tests || (echo "';' in a TEST_CASE name breaks doctest_discover_tests filters" && exit 1)
      - name: docs (snippets, links and anchors, configuration reference)
        # docs/contributing/writing-docs.md; the command-line reference needs a build (gcc-release).
        run: |
          python3 tools/doc_snippets.py --check
          python3 tools/docs_links.py --check
          python3 tools/docs_config_ref.py --check

  clang-tidy:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18 ninja-build libssl-dev zlib1g-dev && cmake --version
      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: configure (compile_commands.json)
        run: cmake --preset debug -DFASTMM_BUILD_BENCH=OFF
      - name: clang-tidy (bugprone-* and performance-* fail the job)
        run: RUN_CLANG_TIDY=run-clang-tidy-18 ./scripts/tidy.sh build/debug

  build-test:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Private-repository runners have 2 vCPUs and 7 GB: a cold sanitizer build takes well over 20 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }} ninja-build libssl-dev zlib1g-dev ccache && cmake --version
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: allow TSan on high-entropy ASLR kernels
        if: contains(matrix.preset, 'tsan')
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DFASTMM_WERROR=ON
      - name: build
        # -k 0: report every compile error in one run instead of stopping at the first one
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc) -- -k 0
      - name: docs (command-line reference is up to date)
        if: matrix.name == 'gcc-release'
        run: python3 tools/docs_cli_help.py --check --bin build/release/bin
      - name: test
        env: { ASAN_OPTIONS: "detect_leaks=1:strict_string_checks=1", UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1", TSAN_OPTIONS: "halt_on_error=1" }
        # The test presets set no job count; run as many tests at once as the runner has cores.
        # Includes the labels examples (quick start, C++ examples), tutorial (its unit test, C++
        # backtest and, outside sanitizers, scripts/docs/tutorial.sh up to the simulated exchange on
        # a free port) and docs (strategy API doc test, public headers compile alone).
        run: ctest --preset ${{ matrix.preset }} -j$(nproc)
      - name: install + external project
        if: matrix.name == 'gcc-release'
        # examples/external-project against the install prefix: strategy lists, a synthetic backtest,
        # 15 s of live trading against fastmm-sim-exchange, a verified replay of that journal.
        run: |
          cmake --install build/release --prefix build/install
          CXX=${{ matrix.cxx }} JOBS=$(nproc) ./scripts/ci-external-project.sh build/release build/install build/external-project

  docker:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker compose build
      - name: smoke test (simulated exchange + engine, 20 s)
        run: |
          docker compose up -d sim-exchange
          docker compose run --rm engine --config /fastmm/configs/sim-docker.toml --duration 20s
      - name: simulator log
        if: always()
        run: docker compose logs sim-exchange | tail -40
      - name: stop
        if: always()
        run: docker compose down

  python:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: sudo apt-get update && sudo apt-get install -y g++-13 ninja-build ccache && python -m pip install --upgrade pip
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python-wheel
      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: wheel (scikit-build-core, FASTMM_BUILD_NET=OFF)
        run: CXX=g++-13 pip wheel . -w dist --no-deps -v
      - name: install wheel + test deps
        # numba: python/tests/test_hot.py and the hot example (the fastmm-engine[hot] extra)
        run: pip install "$(ls dist/fastmm_engine-*.whl)[hot]" pytest pandas
      - name: wheel holds only the package
        run: python -m zipfile -l dist/fastmm_engine-*.whl | awk 'NR>1 {print $1}' | grep -vE '^fastmm(/|_engine-[0-9.]+\.dist-info/)' && exit 1 || true
      - name: pytest (against the installed wheel)
        run: |
          python -c "import fastmm; print(fastmm.__version__, fastmm.build_info())"
          python -m pytest python/tests -q
      - name: examples
        run: |
          python examples/python/backtest_quickstart.py
          python examples/python/sweep_spread.py
          python examples/python/strategies/basic_mm_exact.py
          python examples/python/strategies/basic_mm_hot.py
          python examples/python/strategies/skew_mm.py
