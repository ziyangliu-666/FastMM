name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CPM_SOURCE_CACHE: ~/.cache/CPM
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: clang-format
        run: CLANG_FORMAT=clang-format-18 ./scripts/format.sh --check
      - name: forbidden patterns
        run: |
          ! grep -rnE 'dynamic_cast|std::cout' include src || (echo "forbidden pattern in hot-path code" && exit 1)
          ! grep -rnE 'TEST_CASE\("[^"]*;' tests || (echo "';' in a TEST_CASE name breaks doctest_discover_tests filters" && exit 1)

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18 ninja-build libssl-dev zlib1g-dev && cmake --version
      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: configure (compile_commands.json)
        run: cmake --preset debug -DFASTMM_BUILD_BENCH=OFF
      - name: clang-tidy (bugprone-* and performance-* fail the job)
        run: RUN_CLANG_TIDY=run-clang-tidy-18 ./scripts/tidy.sh build/debug

  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-release,   preset: release,       cxx: g++-13,     pkgs: "g++-13" }
          - { name: gcc-asan,      preset: asan,          cxx: g++-13,     pkgs: "g++-13" }
          - { name: clang-release, preset: clang-release, cxx: clang++-18, pkgs: "clang-18 lld-18" }
          - { name: clang-tsan,    preset: clang-tsan,    cxx: clang++-18, pkgs: "clang-18 lld-18" }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }} ninja-build libssl-dev zlib1g-dev ccache && cmake --version
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: allow TSan on high-entropy ASLR kernels
        if: contains(matrix.preset, 'tsan')
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DFASTMM_WERROR=ON
      - name: build
        run: cmake --build --preset ${{ matrix.preset }} -j4
      - name: test
        env: { ASAN_OPTIONS: "detect_leaks=1:strict_string_checks=1", UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1", TSAN_OPTIONS: "halt_on_error=1" }
        run: ctest --preset ${{ matrix.preset }}
      - name: install + consumer
        if: matrix.name == 'gcc-release'
        run: |
          cmake --install build/release --prefix build/install
          cmake -S tests/install-consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH=$PWD/build/install -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build/consumer && ./build/consumer/consumer

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: sudo apt-get update && sudo apt-get install -y g++-13 ninja-build && pip install cmake build pytest numpy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: wheel
        run: CXX=g++-13 pip wheel . -w dist --no-deps -v && pip install dist/*.whl
      - name: pytest
        run: pytest python/tests
