name: wheels
# Builds the wheels (manylinux_2_28 x86_64): fastmm-engine for CPython 3.9-3.14 and fastmm-engine-live for
# CPython 3.10-3.14, plus the fastmm-engine sdist, and uploads them as artifacts. Each build job runs
# the test suite of the wheel it built; publishing needs all three jobs green.
#
# Publishing to PyPI uses the repository secret PYPI_API_TOKEN (a project-scoped API token) in the
# environment "pypi", and happens on a `v*` tag push, or from a manual run with "publish" checked.
# The environment's deployment rules have to admit the tag ref, or the tag run stops before uploading.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distributions to PyPI"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: build sdist
        run: python -m pip install build twine && python -m build --sdist && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: "CPM_SOURCE_CACHE=/tmp/cpm"
          CIBW_TEST_REQUIRES: "pytest pandas"
          CIBW_TEST_COMMAND: "python -m pytest {project}/python/tests -q"
      - uses: actions/upload-artifact@v4
        with: { name: wheels, path: wheelhouse/*.whl }

  live-wheels:
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # cibuildwheel copies the checkout, wheelhouse/ included, into the container: before the tests,
      # fastmm-engine is installed from /project/wheelhouse only.
      - uses: actions/download-artifact@v4
        with: { name: wheels, path: wheelhouse }
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: python/live
        env:
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # OpenSSL 3, pinned and checksum-verified, static and position-independent.
          CIBW_BEFORE_ALL: "bash {project}/scripts/wheels/build-openssl.sh /opt/fastmm-openssl"
          CIBW_ENVIRONMENT: "CPM_SOURCE_CACHE=/tmp/cpm OPENSSL_ROOT_DIR=/opt/fastmm-openssl FASTMM_OPENSSL_STATIC=ON"
          # auditwheel repair, then: no libssl or libcrypto needed or bundled, only PyInit__live exported.
          CIBW_REPAIR_WHEEL_COMMAND: "auditwheel repair -w {dest_dir} {wheel} && bash {project}/scripts/wheels/check-live-wheel.sh {dest_dir}/fastmm_engine_live-*.whl"
          CIBW_BEFORE_TEST: "pip install numpy && pip install --no-index --find-links {project}/wheelhouse fastmm-engine"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "python -m pytest {project}/python/live/tests -q"
      - uses: actions/upload-artifact@v4
        with: { name: live-wheels, path: wheelhouse/fastmm_engine_live-*.whl }

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [sdist, wheels, live-wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
