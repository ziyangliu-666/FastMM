# p50 latency budgets in ns, from the design (plan section 5.12). tools/check_budgets.py fails a
# benchmark whose median exceeds budget * (1 + slack), default slack 25%.
# Keys are the exact Google Benchmark names (without the _median aggregate suffix).
# Benchmarks not present in a results directory are reported as "missing" and do not fail.
[p50_ns]
"BM_L2_UpdateNearTop" = 30
"BM_L2_ApplyDelta/20" = 300
"BM_L3_AddCancelExecMix" = 60
"BM_Risk_CheckNew_Pass" = 100
"BM_Oms_Lifecycle" = 120
"BM_QuoteManager_Reconcile_6Orders1Change" = 200
"BM_SpscRing_PingPong/real_time" = 300          # round trip = two cross-core hops
"BM_Log_Emit_3Args" = 40
"BM_Journal_Record/1024" = 80
"BM_WsAssemble/16384" = 200
"BM_TickToOrder_Sim" = 2000                     # 1720 ns median per iteration (p50 counter 1023 ns), 2026-09-15
"BM_Json_BinanceDepth20" = 1500                 # bench/bench_json.cpp

# Wire codecs (M3). Budgets are about twice the p50 measured while the machine was heavily loaded.
"BM_Fix_ParseExecReportFill" = 400        # ~250-byte ExecutionReport, 25 fields
"BM_Fix_DecodeExecReportFill" = 800       # parse + map to OrderFillMsg
"BM_Fix_BuildNewOrderSingle" = 300
"BM_Fix_FramerNext" = 25
"BM_Itch_DecodeAddOrder" = 30
"BM_Itch_DecodeOrderExecuted" = 30
"BM_MoldUdp64_FramePacket" = 40           # 10-message packet
"BM_SoupBin_FrameSequenced" = 10
"BM_Ouch42_EncodeEnterOrder" = 40
"BM_Ouch50_EncodeEnterOrder" = 40
"BM_Mdp3_DecodeBook46_4Entries" = 110     # packet with 4 book entries, decoded into the ring
"BM_Mdp3_ArbitrationAB_Heartbeat" = 25    # per packet copy
"BM_Mdp3_FeedAB_Book46_4Entries" = 120    # A plus its duplicate on B, full feed path

# Venue connectors (bench/bench_json.cpp, bench/bench_order_encoders.cpp). Budgets are about twice
# the median of three runs (release preset, pinned with taskset, scripts/bench.sh settings) on a
# shared 8-core desktop under WSL2; the measured p50 is in the comment.
"BM_Json_BybitOrderbook20" = 1500         # 703 ns, 10 bids + 10 asks delta
"BM_Json_BybitTrade" = 300                # 144 ns
"BM_Json_DeribitBookChange" = 1300        # 620 ns, 7 bids + 3 asks, exponent amounts
"BM_Json_DeribitTickerOption" = 800       # 398 ns, BookTicker + OptionTicker
"BM_Json_DeribitTrades3" = 800            # 398 ns, three trades in one frame
"BM_Json_BinanceExecutionReport" = 650    # 309 ns, private: partial fill
"BM_Json_BybitExecution" = 800            # 380 ns, private: fill
"BM_Json_DeribitUserOrder" = 600          # 294 ns, private: user.orders open
"BM_Json_DeribitUserTrade" = 900          # 431 ns, private: user.trades fill
"BM_Encode_BinanceOrderPlace" = 3000      # 1474 ns, order.place with HMAC-SHA256 signature
"BM_Encode_BybitOrderCreate" = 650        # 312 ns, order.create
"BM_Encode_DeribitBuy" = 650              # 319 ns, private/buy

# Median-counter floors. A benchmark below a floor, or one that reported an error, fails: its
# timing no longer measures the work it is named for.
[min_counters]
"BM_TickToOrder_Sim" = { order_events_pct = 50 }  # share of timed ticks that sent orders
